[package]
name = "henmen"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Delegate broad code investigation to a Codex worker, so the calling agent's context stays small."
repository = "https://github.com/CoffeeGiNu/henmen"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
nix = { version = "0.31.3", features = ["signal"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
ulid = "3.0.0"
